name = "hex-number-field"
defaultTargets = ["HexNumberField"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRoots"
git = "https://github.com/leanprover/hex-roots.git"
rev = "3346bd85cbaa256c558260451acf05a9d69a6654"

[[require]]
name = "HexRowReduce"
git = "https://github.com/leanprover/hex-row-reduce.git"
rev = "35b27c54b2211b0a2b4e74f74d0041242edcd524"

[[require]]
name = "HexResultant"
git = "https://github.com/leanprover/hex-resultant.git"
rev = "e52c8dfd13a238fdb604d6afd06fd322823b2671"

[[require]]
name = "HexBerlekampZassenhaus"
git = "https://github.com/leanprover/hex-berlekamp-zassenhaus.git"
rev = "72a2a4ad9616f34975cbb401d1d6937093f3756e"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "main"

[[lean_lib]]
name = "HexNumberField"
