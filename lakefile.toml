name = "hex-number-field"
defaultTargets = ["HexNumberField"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRoots"
git = "https://github.com/leanprover/hex-roots.git"
rev = "5de271feb738cd92d96b8140ba7a9bac2f245d3d"

[[require]]
name = "HexRowReduce"
git = "https://github.com/leanprover/hex-row-reduce.git"
rev = "967216591082d290bc3f9e1b7405effd910bdef9"

[[require]]
name = "HexResultant"
git = "https://github.com/leanprover/hex-resultant.git"
rev = "73847eaaf06e829a7bad6bff02cd95b1e75f8707"

[[require]]
name = "HexBerlekampZassenhaus"
git = "https://github.com/leanprover/hex-berlekamp-zassenhaus.git"
rev = "a75e874fc96b8e87916c6026a8e7cabcf7a99447"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "main"

[[lean_lib]]
name = "HexNumberField"
