name = "hexnumberfield-conformance"
defaultTargets = ["HexNumberFieldConformance", "hexnumberfield_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexNumberField"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

[[lean_lib]]
name = "HexNumberFieldConformance"
globs = ["HexNumberField.Conformance"]

[[lean_exe]]
name = "hexnumberfield_emit_fixtures"
root = "HexNumberField.EmitFixtures"
